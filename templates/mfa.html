<!DOCTYPE html>
<html>
<head>
    <title>Security Check</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; background: green; color: white; border: none; }
    </style>
</head>
<body>
    <h2>Multi-Factor Authentication Required</h2>
    <p>We sent a code to your registered device.</p>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    
    <form method="post">
        <input type="text" name="code" placeholder="Enter 123456">
        <br><br>
        <button type="submit">Verify Identity</button>
    </form>
</body>
</html>
