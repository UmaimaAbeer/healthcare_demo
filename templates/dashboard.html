<!DOCTYPE html>
<html>
<head>
    <title>Claims Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #0056b3; color: white; }
        .sensitive { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Payment Clearinghouse Dashboard</h1>
    <p>Logged in as: <b>{{ user }}</b> | <a href="/logout">Logout</a></p>
    <hr>
    
    <h3>Active Insurance Claims (Confidential)</h3>
    <!-- INFORMATION DISCLOSURE -->
    <table>
        <tr>
            <th>Claim ID</th>
            <th>Patient Name</th>
            <th>Provider</th>
            <th>Status</th>
            <th>Payment Amount</th>
        </tr>
        {% for c in claims %}
        <tr>
            <td>{{ c.claim_id }}</td>
            <td>{{ c.patient }}</td>
            <td>{{ c.provider }}</td>
            <td>{{ c.status }}</td>
            <td class="sensitive">{{ c.amount }}</td>
        </tr>
        {% endfor %}
    </table>
    
    <hr>
    <h3>Claim Search</h3>
    <!-- INPUT VALIDATION VULNERABILITY TARGET -->
    <form action="/search" method="get">
        <input type="text" name="q" placeholder="Enter Claim ID..." style="width: 300px; padding: 8px;">
        <button type="submit" style="padding: 8px;">Search</button>
    </form>
</body>
</html>
